services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sita_msf
      POSTGRES_USER: sita
      POSTGRES_PASSWORD: sita
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sita -d sita_msf"]
      interval: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      DATABASE_URL: postgres://sita:sita@db:5432/sita_msf
      JWT_SECRET: dev-secret-change-me
      PORT: "3000"
    depends_on: { db: { condition: service_healthy } }
    volumes: [uploads:/app/apps/api/uploads]
    ports: ["3000:3000"]

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    depends_on: [api]
    ports: ["8080:80"]

volumes:
  pgdata:
  uploads:
