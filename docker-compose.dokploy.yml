# Compose untuk Dokploy. Set variabel di tab Environment Dokploy:
# Opsional: set POSTGRES_PASSWORD / JWT_SECRET di tab Environment Dokploy.
# Domain: arahkan ke service "web", container port 80. Tidak ada port yang dipublish ke host.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sita_msf
      POSTGRES_USER: sita
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sita}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sita -d sita_msf"]
      interval: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://sita:${POSTGRES_PASSWORD:-sita}@db:5432/sita_msf
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      PORT: "3000"
    depends_on: { db: { condition: service_healthy } }
    volumes: [uploads:/app/apps/api/uploads]
    expose: ["3000"]

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    depends_on: [api]
    expose: ["80"]

volumes:
  pgdata:
  uploads:
